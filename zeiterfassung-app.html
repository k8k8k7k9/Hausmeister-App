<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Zeiterfassung & Aufgaben</title>
  <style>
    :root {
      /* Farben aus dem WorkFlowBuddy-Logo entnommen */
      --primary: #134969;
      --primary-dark: #0d3450;
      --accent: #f97e2b;
      --accent-soft: #fdf1e7;
      --bg: #f4f6f7;
      --card: #ffffff;
      --border: #d7dde0;
      --text: #1c2b33;
      --muted: #5c6b73;
      --danger: #b3261e;
      --ok: #1e6b3c;
    }

    * {
      box-sizing: border-box;
    }

    input[type=radio],
    input[type=checkbox] {
      accent-color: var(--accent);
    }

    body {
      margin: 0;
      font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      padding-bottom: 60px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      max-width: 480px;
      margin: 0 auto 16px auto;
    }

    h1 {
      font-size: 1.15rem;
      margin: 0 0 4px 0;
    }

    h2 {
      font-size: 1rem;
      margin: 0 0 12px 0;
      color: var(--primary-dark);
    }

    p.sub {
      color: var(--muted);
      margin: 0 0 16px 0;
      font-size: 0.9rem;
    }

    label {
      display: block;
      font-weight: 600;
      font-size: 0.9rem;
      margin: 14px 0 6px 0;
    }

    select,
    input[type=text],
    input[type=password],
    input[type=tel],
    textarea {
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
    }

    textarea {
      min-height: 80px;
      resize: vertical;
    }

    .radio-row {
      display: flex;
      gap: 10px;
      margin-top: 6px;
      flex-wrap: wrap;
    }

    .radio-row label {
      display: flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      font-weight: 500;
      margin: 0;
      flex: 1;
      justify-content: center;
      min-width: 90px;
    }

    .radio-row input {
      margin: 0;
    }

    .radio-row label.checked {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .logo {
      display: block;
      width: 200px;
      max-width: 62%;
      height: auto;
      margin: 0 auto 14px auto;
    }

    #card-header {
      text-align: center;
    }

    .greeting {
      font-weight: 600;
      font-size: 1.05rem;
      color: var(--primary);
      margin: 0 0 6px 0;
    }

    button {
      width: 100%;
      padding: 14px;
      font-size: 1.05rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      background: var(--primary);
      color: #fff;
      margin-top: 20px;
      cursor: pointer;
    }

    button:disabled {
      background: #9fb2ba;
    }

    button.secondary {
      background: #fff;
      color: var(--primary);
      border: 1px solid var(--primary);
      margin-top: 10px;
    }

    .task {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
    }

    .task .name {
      font-weight: 600;
      margin-bottom: 4px;
    }

    .task .desc {
      font-size: 0.88rem;
      color: var(--muted);
    }

    .task .meta {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 4px;
    }

    .task label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 500;
      margin-top: 8px;
    }

    .msg {
      padding: 12px;
      border-radius: 8px;
      margin-top: 14px;
      font-size: 0.9rem;
    }

    .msg.error {
      background: #fbeaea;
      color: var(--danger);
      border: 1px solid #e3a8a4;
    }

    .msg.ok {
      background: #e9f5ee;
      color: var(--ok);
      border: 1px solid #a8d9bc;
    }

    .hidden {
      display: none !important;
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #fff;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .file-list {
      margin-top: 10px;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .thumbs {
      display: flex;
      gap: 8px;
      margin-top: 8px;
      flex-wrap: wrap;
    }

    .thumbs img {
      width: 64px;
      height: 64px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    .footer-note {
      text-align: center;
      color: var(--muted);
      font-size: 0.75rem;
      margin-top: 20px;
    }
  </style>
</head>

  <script>
    /* =========================================================================
       KONFIGURATION – vor dem Einsatz anpassen
       ========================================================================= */
    // Basis-URL des n8n-Webhooks (Produktions-URL des "Scan"-Workflows).
    // Beispiel: "https://DEINE-N8N-INSTANZ.app.n8n.cloud/webhook/zeiterfassung"
    // Produktions-URL. Die beiden Endpunkte heissen "/scan" und "/scan-finish"
    // und werden unten angehaengt. Nicht "/webhook-test/" verwenden, das
    // funktioniert nur, solange im n8n-Editor "Execute workflow" laeuft.
    const WEBHOOK_BASE_URL = "https://ki-automatisierung.startplatz-ai-hub.de/webhook/zeiterfassung";

    // Mitarbeiterliste für das Dropdown. Muss manuell mit dem Tab
    // "Mitarbeiter Stammdaten" synchron gehalten werden (Testphase).
    const MITARBEITER = [
      "Panzer, Paul",
      "Müller, Elli",
      "Müller, Peter",
      "Hermann, Siggi",
      "Schneider, Fitzi",
      "Held, Florian",
      "Gustavson, Emil"
    ];

    // Maximale Kantenlänge (px) und JPEG-Qualität für hochgeladene Fotos,
    // damit die Übertragung an n8n klein genug bleibt.
    const IMAGE_MAX_DIMENSION = 1280;
    const IMAGE_JPEG_QUALITY = 0.7;
    const MAX_IMAGES = 3;

    /* ========================================================================= */

    const qs = new URLSearchParams(window.location.search);
    const objektNfcName = qs.get("objekt"); // z.B. "Objekt 10152"

    const el = (id) => document.getElementById(id);
    const show = (id) => el(id).classList.remove("hidden");
    const hide = (id) => el(id).classList.add("hidden");

    let currentTasks = []; // von Backend gelieferte fällige Aufgaben beim 2. Scan
    let selectedImages = []; // Array von JPEG-DataURL-Strings, wie n8n sie erwartet
    let zeitErfasst = true;  // false, wenn heute keine Aufgabe faellig war
    let vorname = "";        // fuer Begruessung und Abschiedstext

    /* "Panzer, Paul" -> "Paul". Ohne Komma wird das erste Wort genommen,
       damit auch ein spaeter geaendertes Namensformat nichts kaputt macht. */
    function vornameVon(name) {
      const s = String(name || "").trim();
      if (!s) return "";
      if (s.indexOf(",") >= 0) {
        return (s.split(",")[1] || "").trim().split(/\s+/)[0] || "";
      }
      return s.split(/\s+/)[0];
    }

    function init() {
      if (!objektNfcName) {
        hide("card-header");
        show("screen-noobjekt");
        return;
      }
      el("objekt-label").textContent = "Objekt-Kennung: " + objektNfcName;

      const sel = el("mitarbeiter");
      MITARBEITER.forEach(name => {
        const opt = document.createElement("option");
        opt.value = name;
        opt.textContent = name;
        sel.appendChild(opt);
      });

      show("screen-login");
      wireRadioHighlight("erledigt-group");
      wireRadioHighlight("bilder-group");
      wireRadioHighlight("notiz-group");
    }

    function wireRadioHighlight(groupId) {
      const group = el(groupId);
      group.querySelectorAll("input[type=radio]").forEach(r => {
        r.addEventListener("change", () => {
          group.querySelectorAll("label").forEach(l => l.classList.remove("checked"));
          r.closest("label").classList.add("checked");
        });
      });
    }

    /* ---------- SCREEN 1: Anmeldung ---------- */

    el("btn-login").addEventListener("click", async () => {
      const mitarbeiter = el("mitarbeiter").value;
      const pin = el("pin").value.trim();
      hide("login-error");

      if (!mitarbeiter) {
        return showError("login-error", "Bitte einen Namen auswählen.");
      }
      if (!pin) {
        return showError("login-error", "Bitte die Personalnummer eingeben.");
      }

      setLoading("btn-login", true, "Anmelden");
      try {
        const res = await postJSON(WEBHOOK_BASE_URL + "/scan", {
          objektNfcName, mitarbeiter, pin
        });

        if (res.mode === "error") {
          showError("login-error", res.message || "Anmeldung fehlgeschlagen.");
          return;
        }

        vorname = vornameVon(mitarbeiter);
        el("greeting").textContent = "Hallo " + vorname + ", schön, dass du da bist!";
        show("greeting");

        if (res.mode === "start") {
          hide("screen-login");
          renderStartScreen(res);
          show("screen-start");
        } else if (res.mode === "end") {
          hide("screen-login");
          currentTasks = res.aufgaben || [];
          renderTaskChecklist(currentTasks);
          show("screen-end");
        } else {
          showError("login-error", "Unerwartete Antwort vom Server.");
        }
      } catch (e) {
        showError("login-error", "Verbindung fehlgeschlagen. Bitte erneut versuchen. (" + e.message + ")");
      } finally {
        setLoading("btn-login", false, "Anmelden");
      }
    });

    function renderStartScreen(res) {
      const tasks = res.aufgaben || [];
      // Das Backend erfasst die Arbeitszeit nur, wenn heute wirklich Aufgaben
      // faellig sind. Steht nichts an, wird keine Zeile in der Zeiterfassung
      // angelegt - und dann darf hier auch kein Arbeitsbeginn behauptet werden.
      zeitErfasst = (res.zeitErfasst !== false) && tasks.length > 0;

      el("start-heading").textContent = zeitErfasst
        ? "Arbeitszeitbeginn erfasst"
        : "Heute nichts zu tun";
      el("start-time-info").textContent = (res.objektname ? res.objektname + " · " : "")
        + (zeitErfasst ? "Arbeitsbeginn " + res.uhrzeit : "Geprüft um " + res.uhrzeit);

      const container = el("start-tasks");
      container.innerHTML = "";
      if (tasks.length === 0) {
        el("start-notasks").textContent = "An diesem Objekt sind heute keine Aufgaben fällig. "
          + "Es wurde deshalb kein Arbeitsbeginn erfasst – du musst hier auch nicht erneut scannen. "
          + "Falls doch etwas zu tun ist, bitte im Büro melden.";
        show("start-notasks");
      } else {
        hide("start-notasks");
        tasks.forEach(t => {
          const div = document.createElement("div");
          div.className = "task";
          div.innerHTML =
            '<div class="name">' + escapeHtml(t.text.split(":")[0]) + '</div>' +
            '<div class="desc">' + escapeHtml(t.text) + '</div>' +
            '<div class="meta">Rhythmus: ' + escapeHtml(t.rhythmus || "-") + '</div>';
          container.appendChild(div);
        });
      }
    }

    el("btn-start-done").addEventListener("click", () => {
      hide("screen-start");
      show("screen-success");
      hide("greeting");
      el("success-text").textContent = zeitErfasst
        ? "Guten Start in den Arbeitstag, " + vorname + "!"
        : "An diesem Objekt ist heute nichts zu tun, " + vorname + ". Es wurde keine Arbeitszeit erfasst.";
    });

    /* ---------- SCREEN 3: Zweit-Scan ---------- */

    function renderTaskChecklist(tasks) {
      const container = el("task-checklist");
      container.innerHTML = "";
      if (!tasks || tasks.length === 0) return;

      const heading = document.createElement("label");
      heading.textContent = "Welche Aufgaben wurden konkret erledigt?";
      container.appendChild(heading);

      tasks.forEach((t, idx) => {
        const div = document.createElement("div");
        div.className = "task";
        div.innerHTML =
          '<div class="desc">' + escapeHtml(t.text) + '</div>' +
          '<label><input type="checkbox" class="task-check" data-idx="' + idx + '"> erledigt</label>';
        container.appendChild(div);
      });
    }

    /* Komfort, damit die Pruefung beim Absenden im Alltag nicht stoert:
       "Ja" hakt alle angezeigten Aufgaben ab, "Nein" entfernt alle Haken.
       Bei "Teilweise" bleibt die Auswahl unberuehrt. */
    el("erledigt-group").addEventListener("change", (e) => {
      const boxes = document.querySelectorAll(".task-check");
      if (e.target.value === "ja") boxes.forEach(b => { b.checked = true; });
      if (e.target.value === "nein") boxes.forEach(b => { b.checked = false; });
    });

    el("bilder-group").addEventListener("change", (e) => {
      if (e.target.value === "ja") show("bilder-upload"); else { hide("bilder-upload"); selectedImages = []; renderThumbs(); }
    });

    el("notiz-group").addEventListener("change", (e) => {
      if (e.target.value === "ja") show("notiz-feld"); else hide("notiz-feld");
    });

    el("bilder-input").addEventListener("change", async (e) => {
      hide("bilder-error");
      const alle = Array.from(e.target.files || []);
      const files = alle.slice(0, MAX_IMAGES);
      selectedImages = [];
      if (!files.length) { renderThumbs(); return; }

      el("bilder-count").textContent = "Bilder werden verarbeitet…";
      const fehler = [];
      for (const f of files) {
        try {
          selectedImages.push(await resizeImageToDataUrl(f, IMAGE_MAX_DIMENSION, IMAGE_JPEG_QUALITY));
        } catch (err) {
          fehler.push((f.name || "Bild") + ": " + ((err && err.message) ? err.message : "unbekannter Fehler"));
        }
      }
      renderThumbs();
      if (alle.length > MAX_IMAGES) {
        el("bilder-count").textContent += " Nur die ersten " + MAX_IMAGES + " Bilder werden verwendet.";
      }
      if (fehler.length) {
        showError("bilder-error", "Nicht alle Bilder konnten verarbeitet werden – " + fehler.join(" | ")
          + ". Tipp: Auf dem iPhone unter Einstellungen > Kamera > Formate auf „Maximale Kompatibilität“"
          + " stellen, dann werden Fotos als JPEG statt HEIC gespeichert.");
      }
    });

    function renderThumbs() {
      const box = el("bilder-thumbs");
      box.innerHTML = "";
      selectedImages.forEach(src => {
        const img = document.createElement("img");
        img.src = src;
        box.appendChild(img);
      });
      el("bilder-count").textContent = selectedImages.length + " Bild(er) ausgewählt.";
    }

    /* Verkleinert eine Bilddatei zu einer JPEG-DataURL.
       Der frueher hier verwendete Weg (FileReader -> Base64-DataURL -> Image)
       scheitert auf iOS Safari bei grossen Fotos und bei HEIC lautlos: das
       Promise wird nie erfuellt oder abgelehnt, selectedImages bleibt leer und
       es erscheint keine Fehlermeldung. Deshalb jetzt zwei robustere Wege
       plus Zeitlimit plus Pruefung des Ergebnisses. */
    async function resizeImageToDataUrl(file, maxDim, quality) {
      const bild = await ladeBild(file);
      try {
        if (!bild.width || !bild.height) throw new Error("Bild konnte nicht gelesen werden");
        let width = bild.width, height = bild.height;
        if (width > maxDim || height > maxDim) {
          if (width > height) { height = Math.round(height * maxDim / width); width = maxDim; }
          else { width = Math.round(width * maxDim / height); height = maxDim; }
        }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, width, height);
        ctx.drawImage(bild.drawable, 0, 0, width, height);
        const dataUrl = canvas.toDataURL("image/jpeg", quality);
        // iOS gibt bei Speicherproblemen "data:," oder eine fast leere Grafik
        // zurueck, ohne einen Fehler zu werfen. Deshalb Ergebnis pruefen.
        if (dataUrl.indexOf("data:image/jpeg") !== 0 || dataUrl.length < 2000) {
          throw new Error("Foto zu groß für dieses Gerät");
        }
        return dataUrl;
      } finally {
        bild.cleanup();
      }
    }

    /* Liefert { drawable, width, height, cleanup }.
       Weg 1: createImageBitmap nutzt den Decoder des Betriebssystems und kann
              damit auch HEIC. Kein Base64-Zwischenschritt.
       Weg 2: Object-URL im img-Element, falls Weg 1 fehlt oder scheitert. */
    async function ladeBild(file) {
      if (typeof createImageBitmap === "function") {
        try {
          let bmp;
          try {
            bmp = await mitZeitlimit(createImageBitmap(file, { imageOrientation: "from-image" }), 20000);
          } catch (e1) {
            bmp = await mitZeitlimit(createImageBitmap(file), 20000);
          }
          if (bmp && bmp.width) {
            return {
              drawable: bmp, width: bmp.width, height: bmp.height,
              cleanup: () => { if (bmp.close) bmp.close(); }
            };
          }
        } catch (e) { /* weiter mit Weg 2 */ }
      }
      const url = URL.createObjectURL(file);
      try {
        const img = await mitZeitlimit(new Promise((resolve, reject) => {
          const i = new Image();
          i.onload = () => resolve(i);
          i.onerror = () => reject(new Error("Format wird nicht unterstützt"));
          i.src = url;
        }), 20000);
        return {
          drawable: img,
          width: img.naturalWidth || img.width,
          height: img.naturalHeight || img.height,
          cleanup: () => URL.revokeObjectURL(url)
        };
      } catch (e) {
        URL.revokeObjectURL(url);
        throw e;
      }
    }

    /* Verhindert, dass ein haengender Bild-Decoder das Formular blockiert. */
    function mitZeitlimit(promise, ms) {
      return new Promise((resolve, reject) => {
        const t = setTimeout(() => reject(new Error("Verarbeitung hat zu lange gedauert")), ms);
        Promise.resolve(promise).then(
          v => { clearTimeout(t); resolve(v); },
          e => { clearTimeout(t); reject(e); }
        );
      });
    }

    el("btn-end-submit").addEventListener("click", async () => {
      hide("end-error");
      const erledigt = document.querySelector('input[name=erledigt]:checked');
      const bilderJaNein = document.querySelector('input[name=bilderJaNein]:checked');
      const notizJaNein = document.querySelector('input[name=notizJaNein]:checked');

      if (!erledigt) return showError("end-error", "Bitte a) beantworten: Wurden die Arbeiten erledigt?");
      if (!bilderJaNein) return showError("end-error", "Bitte angeben, ob Bilder hochgeladen werden sollen.");
      if (notizJaNein && notizJaNein.value === "ja" && !el("notiz-text").value.trim()) {
        return showError("end-error", "Bitte Notiztext eingeben oder auf 'Nein' wechseln.");
      }
      if (bilderJaNein.value === "ja" && selectedImages.length === 0) {
        return showError("end-error", "Bitte mindestens ein Bild auswählen oder auf 'Nein' wechseln.");
      }

      const aufgabenErledigt = currentTasks.map((t, idx) => ({
        text: t.text,
        erledigt: !!document.querySelector('.task-check[data-idx="' + idx + '"]:checked')
      }));
      const abgehakt = aufgabenErledigt.filter(a => a.erledigt).length;

      /* Widerspruch zwischen der Gesamtantwort und der Checkliste abfangen.
         Ohne diese Pruefung kann der Mitarbeiter "Ja" waehlen und nichts
         abhaken - die Mail an den Verwalter meldet dann, es sei nichts
         erledigt worden, und "zuletzt ausgefuehrt am" bleibt unveraendert.
         Nur pruefen, wenn ueberhaupt Aufgaben angezeigt wurden. */
      if (currentTasks.length > 0) {
        if (erledigt.value === "ja" && abgehakt === 0) {
          return showError("end-error", "Du hast angegeben, dass die Arbeiten erledigt wurden, "
            + "aber keine einzige Aufgabe abgehakt. Bitte hake die erledigten Aufgaben ab – "
            + "oder wechsle auf „Nein“ beziehungsweise „Teilweise“.");
        }
        if (erledigt.value === "ja" && abgehakt < currentTasks.length) {
          return showError("end-error", "Du hast „Ja“ gewählt, aber nur " + abgehakt + " von "
            + currentTasks.length + " Aufgaben abgehakt. Bitte alle abhaken – "
            + "oder auf „Teilweise“ wechseln.");
        }
        if (erledigt.value === "teilweise" && abgehakt === 0) {
          return showError("end-error", "Bei „Teilweise“ muss mindestens eine Aufgabe abgehakt sein. "
            + "Bitte abhaken – oder auf „Nein“ wechseln.");
        }
        if (erledigt.value === "nein" && abgehakt > 0) {
          return showError("end-error", "Du hast „Nein“ gewählt, aber " + abgehakt
            + " Aufgabe(n) abgehakt. Bitte die Haken entfernen – "
            + "oder auf „Ja“ beziehungsweise „Teilweise“ wechseln.");
        }
      }

      const payload = {
        objektNfcName,
        mitarbeiter: el("mitarbeiter").value,
        pin: el("pin").value.trim(),
        erledigtStatus: erledigt.value,          // "ja" | "nein" | "teilweise"
        aufgabenErledigt,
        notiz: (notizJaNein.value === "ja") ? el("notiz-text").value.trim() : "",
        bilder: (bilderJaNein.value === "ja") ? selectedImages : []
      };

      setLoading("btn-end-submit", true, "Absenden");
      try {
        const res = await postJSON(WEBHOOK_BASE_URL + "/scan-finish", payload);
        if (res.mode === "error") {
          showError("end-error", res.message || "Absenden fehlgeschlagen.");
          return;
        }
        hide("screen-end");
        show("screen-success");
        hide("greeting");
        const info = "Danke für deinen Einsatz heute, " + vorname + "! "
          + "Feierabend erfasst um " + (res.uhrzeit || "") + ". "
          + (res.mailGesendet === false
              ? "Es wurde keine Mail an die Verwaltung gesendet."
              : "Die Verwaltung wurde informiert.");
        el("success-text").textContent = res.warnung ? (info + " " + res.warnung) : info;
      } catch (e) {
        showError("end-error", "Verbindung fehlgeschlagen. Bitte erneut versuchen. (" + e.message + ")");
      } finally {
        setLoading("btn-end-submit", false, "Absenden");
      }
    });

    /* ---------- Hilfsfunktionen ---------- */

    async function postJSON(url, body) {
      const resp = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });
      if (!resp.ok) {
        throw new Error("HTTP " + resp.status);
      }
      return resp.json();
    }

    function showError(id, text) {
      el(id).textContent = text;
      show(id);
    }

    function setLoading(btnId, loading, label) {
      const btn = el(btnId);
      btn.disabled = loading;
      btn.innerHTML = loading ? '<span class="spinner"></span>Bitte warten&hellip;' : label;
    }

    function escapeHtml(s) {
      return String(s || "").replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    init();
  </script>
</body>

</html>
